<!doctype html>
<html lang="fa">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Data Net</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #202022;
            color: #eef3ff;
        }

        header {
            background: #1677ff;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        main {
            padding: 20px;
        }

        .card {
            background: #121212;
            border: 1px solid #414143;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 24px rgba(31, 36, 48, 0.06);
        }

        .btn {
            display: inline-block;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #0d5bd3;
        }

        footer {
            text-align: center;
            color: #6b7280;
            padding: 24px 16px 40px;
        }

        textarea{
            background-color: #3b3b3b;
        }
    </style>
</head>

<body>
    <header>
        <h1>DataNet</h1>
        <p>Under Construction</p>
    </header>
    <main>
        <div class="card">
            <h2>Send Text Message</h2>
            <form id="messageForm">
                <textarea name="message" rows="5" cols="40" placeholder="Write Your Message ..."></textarea><br>
                <button class="btn" type="submit">Send</button>
            </form>
            <!-- جایی برای نمایش نتیجه -->
            <div id="result" style="margin-top:10px; color:green;"></div>
        </div>
    </main>
    <footer>
        <small>© 2026</small>
    </footer>

    <script>
        const form = document.getElementById('messageForm');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // جلوگیری از رفرش صفحه

            const formData = new FormData(form);
            const message = formData.get('message');

            try {
                const res = await fetch('/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ message })
                });

                const text = await res.text();
                resultDiv.textContent = text; // نمایش نتیجه سرور
                resultDiv.style.color = "green";
            } catch (err) {
                resultDiv.textContent = "Error: " + err.message;
                resultDiv.style.color = "red";
            }
        });
    </script>

</body>

</html>
